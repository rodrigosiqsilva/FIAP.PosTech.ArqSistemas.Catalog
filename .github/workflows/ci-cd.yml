name: CI/CD Pipeline - CatalogAPI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || 'fiap-fcg-cluster' }}
  ECR_REPOSITORY: fiap-catalog-api

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore FIAP.PosTech.ArqSistemas.CatalogAPI/FIAP.PosTech.ArqSistemas.CatalogAPI.csproj

    - name: Build Project
      run: dotnet build FIAP.PosTech.ArqSistemas.CatalogAPI/FIAP.PosTech.ArqSistemas.CatalogAPI.csproj --no-restore --configuration Release

    - name: Run Tests
      run: |
        if ls *Test*/*csproj 1> /dev/null 2>&1; then
          dotnet test --no-build --configuration Release --verbosity normal
        else
          echo "Nenhum projeto de testes separado encontrado. Prosseguindo."
        fi

  build-scan-deploy:
    name: Containerize, Scan & Deploy (EKS)
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Ensure ECR Repository Exists
      run: |
        aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || \
        aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }}

    - name: Build and Tag Docker Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        LATEST_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "Building image: $IMAGE_URI"
        docker build -t $IMAGE_URI -t $LATEST_URI -f FIAP.PosTech.ArqSistemas.CatalogAPI/Dockerfile .
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
        echo "LATEST_URI=$LATEST_URI" >> $GITHUB_ENV

    - name: Security Scan Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_URI }}
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Docker Image to Amazon ECR
      run: |
        docker push ${{ env.IMAGE_URI }}
        docker push ${{ env.LATEST_URI }}

    - name: Connect to EKS Cluster
      run: |
        aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

    - name: Deploy Kubernetes Secrets (Zero Hardcoded Credentials)
      run: |
        kubectl create secret generic mongodb-secret \
          --from-literal=connection-string="${{ secrets.MONGODB_CONNECTIONSTRING || secrets.MONGODB_CONNECTIONSTRINGS }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy Support Infrastructure (Redis & Elasticsearch)
      run: |
        kubectl apply -f FIAP.PosTech.ArqSistemas.CatalogAPI/K8S/redis.yml
        kubectl apply -f FIAP.PosTech.ArqSistemas.CatalogAPI/K8S/elasticsearch.yml

    - name: Deploy CatalogAPI to EKS (Rolling Update)
      run: |
        kubectl apply -f FIAP.PosTech.ArqSistemas.CatalogAPI/K8S/deployment.yml
        kubectl set image deployment/fiap-catalog-api-deployment fiap-catalog-api=${{ env.IMAGE_URI }}
        kubectl rollout status deployment/fiap-catalog-api-deployment --timeout=180s
