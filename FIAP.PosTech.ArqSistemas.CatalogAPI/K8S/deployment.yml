apiVersion: apps/v1
kind: Deployment
metadata:
  name: fiap-catalog-api-deployment
  labels:
    app: fiap-catalog-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: fiap-catalog-api
  template:
    metadata:
      labels:
        app: fiap-catalog-api
    spec:
      containers:
      - name: fiap-catalog-api
        image: fiap-catalog-api:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 4040
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DOTNET_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:4040"
        - name: MongoDbSettings__ConnectionString
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: connection-string
        - name: MongoDbSettings__DatabaseName
          value: "FCGDatabase"
        - name: RedisSettings__ConnectionString
          value: "redis-service:6379"
        - name: ElasticsearchSettings__Uri
          value: "http://elasticsearch-service:9200"
        - name: ElasticsearchSettings__DefaultIndex
          value: "games"

---

apiVersion: v1
kind: Service
metadata:
  name: fiap-catalog-api-service
  labels:
    app: fiap-catalog-api
spec:
  type: LoadBalancer
  selector:
    app: fiap-catalog-api
  ports:
  - name: http
    port: 80
    targetPort: 4040